[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "yyx", email = "yyx3112164@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "langgraph>=1.2.11",
    "mcp>=1.26,<2",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.14.0",
    "pypdf>=6.19.0",
    "qdrant-client>=1.19.1",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.54",
    "tenacity>=9.1.4",
]

[project.optional-dependencies]
rerank = [
    "sentence-transformers>=6.1.0",
]

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

# The importable package is the `app/` directory at the project root (flat layout),
# but the project name is `backend`. Tell uv_build where the module actually lives
# instead of letting it look for `src/backend/` (which we removed).
[tool.uv.build-backend]
module-name = "app"
module-root = ""

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
